<!DOCTYPE html>
<html lang="en" data-theme="dark" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — ClearGround</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="shortcut icon" href="assets/favicon.svg">

  <meta name="description" content="Sign in to your ClearGround client portal to access continuous 48-hour radon telemetry, certified inspection certificates, and active mitigation records.">
  
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/layout.css">
</head>
<body style="min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 24px; position: relative;">

  <!-- Background Ambient Glow -->
  <div class="hero-glow-backdrop"></div>

  <!-- Top Bar Controls -->
  <div class="auth-top-bar" style="position: absolute; top: 16px; left: 16px; right: 16px; display: flex; align-items: center; justify-content: space-between; z-index: 20; gap: 8px;">
    <a href="index.html" class="btn btn-secondary btn-sm" style="gap: 6px; padding: 6px 14px; font-size: 13px;">
      <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>
      Website
    </a>
    <div style="display: flex; align-items: center; gap: 8px;">
      <button type="button" class="btn-icon rtl-toggle-btn" style="width: 36px; height: 36px; font-size: 11px; font-weight: 700; font-family: var(--font-heading);" aria-label="Toggle RTL direction">RTL</button>
      <button type="button" class="btn-icon theme-toggle-btn" style="width: 36px; height: 36px;" aria-label="Toggle dark/light theme">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/></svg>
      </button>
    </div>
  </div>

  <!-- Login Card (Rule 7) -->
  <div class="card-glass" style="width: 100%; max-width: 460px; padding: clamp(24px, 5vw, 36px) clamp(20px, 4vw, 32px); z-index: 10; margin-top: 56px; border-radius: 24px;">
    
    <!-- Logo & Heading -->
    <div style="text-align: center; margin-bottom: 24px;">
      <a href="index.html" class="brand-logo" style="justify-content: center; margin-bottom: 18px;">
        <div class="brand-icon-box">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            <circle cx="12" cy="11" r="3"/>
          </svg>
        </div>
        <div class="brand-text">Clear<span>Ground</span></div>
      </a>
      <h1 style="font-size: 26px; margin-bottom: 6px; font-family: var(--font-heading); font-weight: 800;">Welcome Back</h1>
      <p style="font-size: 14px; color: var(--text-secondary); line-height: 1.5;">Sign in to access your certified radon reports and monitor telemetry</p>
    </div>
    <!-- Authentication Form -->
    <form id="login-form" novalidate>
      <div class="form-group">
        <label for="login-email" class="form-label">Email Address <span class="required">*</span></label>
        <input type="email" id="login-email" class="form-control" placeholder="name@domain.com" required autocomplete="email">
      </div>

      <div class="form-group">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
          <label for="login-password" class="form-label" style="margin-bottom: 0;">Password <span class="required">*</span></label>
          <a href="#" style="font-size: 12.5px; color: var(--primary-purple); text-decoration: none;">Forgot password?</a>
        </div>
        <div style="position: relative;">
          <input type="password" id="login-password" class="form-control" placeholder="••••••••••••" required autocomplete="current-password" style="padding-right: 44px;">
          <button type="button" class="btn-icon toggle-password-vis" data-target="login-password" aria-label="Show password" style="position: absolute; right: 6px; top: 5px; width: 38px; height: 38px; background: none; border: none; cursor: pointer; color: var(--text-muted);">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>

      <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 22px; font-size: 13px;">
        <label class="form-check" style="cursor: pointer;">
          <input type="checkbox" checked>
          <span style="color: var(--text-secondary); margin-left: 6px;">Keep me signed in</span>
        </label>
      </div>

      <button type="submit" class="btn btn-primary btn-block" style="height: 48px; border-radius: 9999px; font-size: 15px; font-weight: 600;">
        Sign In
      </button>

      <!-- Social Auth Divider (Rule 6) -->
      <div class="social-auth-divider">
        <span>or continue with</span>
      </div>

      <!-- Google & Apple Sign-In Buttons -->
      <div class="social-buttons-stack">
        <button type="button" class="btn-social-auth btn-google-auth" id="google-auth-btn">
          <svg width="18" height="18" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
          </svg>
          <span>Continue with Google</span>
        </button>

        <button type="button" class="btn-social-auth btn-apple-auth" id="apple-auth-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.37c.63-.79 1.06-1.88.94-2.98-.92.04-2.07.63-2.73 1.41-.58.68-1.09 1.77-.96 2.85 1.04.08 2.12-.53 2.75-1.28"/>
          </svg>
          <span>Continue with Apple</span>
        </button>
      </div>

      <div style="text-align: center; font-size: 14px; color: var(--text-secondary);">
        Don't have an account? <a href="register.html" style="color: var(--primary-purple); font-weight: 600; text-decoration: none;">Sign Up</a>
      </div>
    </form>
  </div>

  <div style="margin-top: 24px; font-size: 12px; color: var(--text-muted); text-align: center; z-index: 10;">
    © 2026 ClearGround Radon Systems. Encrypted 256-bit TLS Environmental Data Security.
  </div>

  <script src="js/theme.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/forms.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
